App\Entity\Measurement:
    properties:
        date:
            - NotBlank: { groups: ['create'] }
        celsius:
            - NotNull: { groups: ['create','edit'] }
            - Range:
                  min: -100
                  max: 100
                  groups: ['create','edit']
        location:
            - NotNull: { groups: ['create','edit'] }

App\Entity\Location:
    properties:
        city:
            - NotBlank: { groups: ['create','edit'] }
        country:
            - NotBlank: { groups: ['create','edit'] }
        latitude:
            - NotNull: { groups: ['create','edit'] }
            - Range:
                  min: -90
                  max: 90
                  groups: ['create','edit']
        longitude:
            - NotNull: { groups: ['create','edit'] }
            - Range:
                  min: -180
                  max: 180
                  groups: ['create','edit']
